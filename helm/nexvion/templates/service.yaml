apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nexvion-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexvion

spec:
  type: {{ .Values.service.type }}

  selector:
    app: nexvion

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
