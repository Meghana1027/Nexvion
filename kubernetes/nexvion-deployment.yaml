apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion
  namespace: nexvion
  labels:
    app: nexvion

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nexvion

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: nexvion

    spec:
      containers:
        - name: nexvion
          image: meghanas12345/nexvion:13
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: nexvion-config
              mountPath: /etc/nexvion/config
              readOnly: true

            - name: nexvion-secret
              mountPath: /etc/nexvion/secret
              readOnly: true

      volumes:
        - name: nexvion-config
          configMap:
            name: nexvion-config

        - name: nexvion-secret
          secret:
            secretName: nexvion-secret
